<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1030" viewBox="0 0 1080 1030" role="img">
<title>Luồng suy luận lịch sử và mô phỏng tuần tự</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1080" height="1030" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#0f172a">
<text x="540" y="34" text-anchor="middle" font-size="25" fill="#0f172a" font-weight="bold">
<tspan x="540" dy="0">Luồng suy luận lịch sử và mô phỏng tuần tự</tspan>
</text>
<text x="275" y="78" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="bold">
<tspan x="275" dy="0">PHÂN TÍCH LỊCH SỬ</tspan>
</text>
<text x="805" y="78" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="bold">
<tspan x="805" dy="0">MÔ PHỎNG TUẦN TỰ</tspan>
</text>
<rect x="35" y="110" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="162.62" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="275.0" dy="0">Lọc khoảng ngày từ Demo</tspan>
</text>
<polyline points="275,205 275,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="250" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="291.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="275.0" dy="0">extract_features trên phần đã chọn</tspan>
<tspan x="275.0" dy="23.2">Không có vector hợp lệ: thông báo, dừng</tspan>
</text>
<polyline points="275,345 275,390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="390" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="431.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="275.0" dy="0">Scaler.transform → decision_function</tspan>
<tspan x="275.0" dy="23.2">Dùng bundle đã học trên Train</tspan>
</text>
<polyline points="275,485 275,530" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="530" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="571.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="275.0" dy="0">Căn kết quả với index đặc trưng</tspan>
<tspan x="275.0" dy="23.2">d(x) &lt; 0: bất thường; còn lại: bình thường</tspan>
</text>
<polyline points="275,625 275,670" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="670" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="711.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="275.0" dy="0">Tính severity; gợi ý loại và dấu hiệu</tspan>
<tspan x="275.0" dy="23.2">cho các điểm bất thường</tspan>
</text>
<polyline points="275,765 275,810" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="810" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="851.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="275.0" dy="0">Hiển thị KPI, biểu đồ và bảng</tspan>
<tspan x="275.0" dy="23.2">Không ghi cảnh báo vào SQLite</tspan>
</text>
<rect x="565" y="110" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="805.0" y="151.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="805.0" dy="0">Đọc hàng Demo theo con trỏ</tspan>
<tspan x="805.0" dy="23.2">Thêm vào buffer, giữ tối đa 50 mẫu</tspan>
</text>
<polyline points="805,205 805,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="250" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="805.0" y="291.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="805.0" dy="0">extract_latest: cần ít nhất 25 mẫu</tspan>
<tspan x="805.0" dy="23.2">Chưa đủ: warming_up, chưa chấm điểm</tspan>
</text>
<polyline points="805,345 805,390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="390" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="805.0" y="431.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="805.0" dy="0">Có vector: transform → decision_function</tspan>
<tspan x="805.0" dy="23.2">Dùng bundle đã học trên Train</tspan>
</text>
<polyline points="805,485 805,530" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="530" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="805.0" y="571.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="805.0" dy="0">d(x) &lt; 0: bất thường</tspan>
<tspan x="805.0" dy="23.2">Ngược lại: bình thường, không tạo cảnh báo</tspan>
</text>
<polyline points="805,625 805,670" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="670" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="805.0" y="711.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="805.0" dy="0">Tính severity; gợi ý loại và dấu hiệu</tspan>
<tspan x="805.0" dy="23.2">cho điểm bất thường</tspan>
</text>
<polyline points="805,765 805,810" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="810" width="480" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="805.0" y="851.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="805.0" dy="0">Lưu cảnh báo theo ID thời điểm</tspan>
<tspan x="805.0" dy="23.2">Upsert vào SQLite</tspan>
</text>
<rect x="565" y="940" width="480" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="805.0" y="977.62" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="805.0" dy="0">Cập nhật hiển thị / chuyển mẫu tiếp</tspan>
</text>
<polyline points="805,905 805,940" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1045,297 1065,297 1065,972 1045,972" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="963" y="370" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="normal">
<tspan x="963" dy="0">Chưa đủ: bỏ qua</tspan>
</text>
<polyline points="1045,577 1065,577" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="966" y="650" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="normal">
<tspan x="966" dy="0">Bình thường: bỏ qua</tspan>
</text>
<text x="430" y="370" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="normal">
<tspan x="430" dy="0">Có vector</tspan>
</text>
<text x="935" y="370" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="normal">
<tspan x="935" dy="0"></tspan>
</text>
<text x="715" y="370" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="normal">
<tspan x="715" dy="0">Có vector</tspan>
</text>
<text x="695" y="650" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="normal">
<tspan x="695" dy="0">Bất thường</tspan>
</text>
</g></svg>
