<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img">
<title>Vòng đời cảnh báo qua thao tác trên dashboard</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1080" height="560" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#0f172a">
<text x="540" y="34" text-anchor="middle" font-size="25" fill="#0f172a" font-weight="bold">
<tspan x="540" dy="0">Vòng đời cảnh báo qua thao tác trên dashboard</tspan>
</text>
<rect x="35" y="170" width="240" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="155.0" y="205.615" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="normal">
<tspan x="155.0" dy="0">Mới</tspan>
<tspan x="155.0" dy="24.65">new</tspan>
</text>
<rect x="405" y="170" width="270" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="540.0" y="205.615" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="normal">
<tspan x="540.0" dy="0">Đã tiếp nhận</tspan>
<tspan x="540.0" dy="24.65">acknowledged</tspan>
</text>
<rect x="805" y="170" width="240" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="925.0" y="205.615" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="normal">
<tspan x="925.0" dy="0">Đã đóng</tspan>
<tspan x="925.0" dy="24.65">closed</tspan>
</text>
<polyline points="275,212 405,212" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340" y="150" text-anchor="middle" font-size="15" fill="#475569" font-weight="normal">
<tspan x="340" dy="0">Tiếp nhận</tspan>
</text>
<polyline points="675,212 805,212" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="740" y="150" text-anchor="middle" font-size="15" fill="#475569" font-weight="normal">
<tspan x="740" dy="0">Đóng</tspan>
</text>
<polyline points="155,255 155,355 925,355 925,255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="540" y="340" text-anchor="middle" font-size="15" fill="#475569" font-weight="normal">
<tspan x="540" dy="0">Đóng trực tiếp</tspan>
</text>
<text x="540" y="90" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="normal">
<tspan x="540" dy="0">Cảnh báo mô phỏng mới → lưu SQLite với trạng thái new</tspan>
</text>
<text x="540" y="420" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="normal">
<tspan x="540" dy="0">Tiếp nhận: cập nhật acknowledged_at. Đóng: cập nhật closed_at.</tspan>
<tspan x="540" dy="24.65">Cả hai lưu ghi chú và updated_at; giao diện không có thao tác mở lại.</tspan>
</text>
<text x="540" y="505" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="normal">
<tspan x="540" dy="0">Upsert cùng alert_id giữ trạng thái, ghi chú và thời điểm xử lý đã lưu.</tspan>
</text>
</g></svg>
