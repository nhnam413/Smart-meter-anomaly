</text>
<polyline points="830,245 830,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="455,462 540,462 540,355 625,355" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="625" y="475" width="410" height="75" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="830.0" y="506.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="830.0" dy="0">SQLite: alerts</tspan>
<tspan x="830.0" dy="23.2">Lưu cảnh báo từ mô phỏng; đọc hàng đợi</tspan>
</text>
<polyline points="830,410 830,475" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="625" y="610" width="410" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="830.0" y="634.42" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="830.0" dy="0">Người vận hành qua dashboard</tspan>
<tspan x="830.0" dy="23.2">Tiếp nhận / đóng / ghi chú</tspan>
<tspan x="830.0" dy="23.2">Xuất hàng đợi đã lọc ra CSV</tspan>
</text>
<polyline points="830,550 830,610" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="600" width="410" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="629.42" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="250.0" dy="0">Tiện ích độc lập: 03_producer.py</tspan>
<tspan x="250.0" dy="23.2">demo_stream.csv → stream_buffer.jsonl</tspan>
<tspan x="250.0" dy="23.2">Dashboard không đọc JSONL</tspan>
</text>
</g></svg>
