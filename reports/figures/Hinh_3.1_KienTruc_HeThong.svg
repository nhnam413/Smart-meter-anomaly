<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img">
<title>Kiến trúc và luồng dữ liệu của hệ thống</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1080" height="760" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#0f172a">
<text x="540" y="34" text-anchor="middle" font-size="25" fill="#0f172a" font-weight="bold">
<tspan x="540" dy="0">Kiến trúc và luồng dữ liệu của hệ thống</tspan>
</text>
<rect x="350" y="65" width="380" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="540.0" y="91.02000000000001" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="540.0" dy="0">Dữ liệu UCI theo phút</tspan>
<tspan x="540.0" dy="23.2">01_data_prep.py: làm sạch, gom giờ</tspan>
</text>
<rect x="45" y="180" width="410" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="205.615" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="normal">
<tspan x="250.0" dy="0">train_hourly.csv</tspan>
<tspan x="250.0" dy="24.65">80% đầu theo thời gian</tspan>
</text>
<rect x="625" y="180" width="410" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="830.0" y="205.615" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="normal">
<tspan x="830.0" dy="0">demo_stream.csv</tspan>
<tspan x="830.0" dy="24.65">20% cuối + bất thường tổng hợp</tspan>
</text>
<polyline points="440,130 440,155 250,155 250,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="640,130 640,155 830,155 830,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="295" width="410" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="319.42" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="250.0" dy="0">features.py → 9 đặc trưng</tspan>
<tspan x="250.0" dy="23.2">02_train.py: fit RobustScaler</tspan>
<tspan x="250.0" dy="23.2">và Isolation Forest trên Train</tspan>
</text>
<polyline points="250,245 250,295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="425" width="410" height="75" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="456.02" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="250.0" dy="0">model_bundle.pkl</tspan>
<tspan x="250.0" dy="23.2">model, scaler, features, medians, iqrs</tspan>
</text>
<polyline points="250,380 250,425" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="625" y="300" width="410" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="830.0" y="336.92" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="normal">
<tspan x="830.0" dy="0">04_dashboard.py + features.py</tspan>
<tspan x="830.0" dy="23.2">Lịch sử / mô phỏng tuần tự</tspan>
