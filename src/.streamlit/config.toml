# Script-level configuration is loaded even when launched from the workspace/IDE.
# Keep a single custom theme: do not add theme.light/theme.dark variants.
[theme]
base = "light"
primaryColor = "#0066FF"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
showWidgetBorder = true
font = "sans serif"
